<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cheguei - Check-in Inteligente</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Phosphor Icons (para iconografia moderna) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      /* Paleta da Logo e Tema Escuro/Verde */
      --color-primary: #00a859;
      --color-primary-hover: #008f4c;
      --color-primary-light: rgba(0, 168, 89, 0.15);
      
      --color-bg-base: #09090b;
      --color-surface: #18181b;
      --color-surface-elevated: #27272a;
      
      --color-text-primary: #fafafa;
      --color-text-secondary: #a1a1aa;
      --color-text-muted: #71717a;

      --color-danger: #ef4444;
      --color-warning: #f59e0b;

      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;

      --shadow-glow: 0 0 40px rgba(0, 168, 89, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--color-bg-base);
      color: var(--color-text-primary);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 168, 89, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(0, 168, 89, 0.05), transparent 25%);
    }

    /* Container Principal (Tablet) */
    .app-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Header - No topo absoluto da tela */
    .header {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      width: 100%;
      pointer-events: none;
    }

    .logo-container img {
      width: 98vw;
      height: auto;
      max-width: 1200px;
      max-height: 48vh;
      object-fit: contain;
      filter: drop-shadow(0px 4px 12px rgba(0,0,0,0.5));
      pointer-events: auto;
    }

    /* Status e Conector da Impressora */
    .printer-module {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      z-index: 9999;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    .printer-module:hover,
    .printer-module:active {
      background: rgba(0, 168, 89, 0.2);
      border-color: var(--color-primary);
      transform: scale(1.08);
    }

    .printer-module i {
      font-size: 2rem;
      color: var(--color-text-secondary);
      transition: color 0.3s ease;
      pointer-events: none;
    }

    /* Botão Flutuante do Editor de Etiquetas */
    .editor-module {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      height: 60px;
      padding: 0 24px;
      background: rgba(24, 24, 27, 0.85);
      border-radius: var(--radius-full);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border: 2px solid rgba(0, 168, 89, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      z-index: 9999;
      color: var(--color-text-primary);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .editor-module:hover {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
      transform: translateY(-4px) scale(1.05);
      box-shadow: var(--shadow-glow);
    }

    .editor-module i {
      font-size: 1.4rem;
    }

    .printer-module.connected i {
      color: var(--color-primary);
    }

    .printer-module.connected {
      background: rgba(0, 168, 89, 0.85);
      border-color: var(--color-primary);
      box-shadow: 0 0 20px rgba(0, 168, 89, 0.4);
    }

    .printer-module.connected i {
      color: #fff;
    }

    .status-dot {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--color-danger);
      box-shadow: 0 0 8px var(--color-danger);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.connected {
      background-color: var(--color-primary);
      box-shadow: 0 0 12px var(--color-primary);
    }

    .printer-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--color-text-secondary);
    }

    .btn-connect {
      background: var(--color-primary-light);
      color: var(--color-primary);
      border: 1px solid rgba(0, 168, 89, 0.3);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-connect:hover {
      background: var(--color-primary);
      color: var(--color-bg-base);
      border-color: var(--color-primary);
    }

    .btn-connect:active {
      transform: scale(0.96);
    }

    .btn-connect i {
      font-size: 1.125rem;
    }

    /* Área Principal - Centralizada com precisão matemática no meio da tela */
    .main-content {
      position: absolute;
      top: 57%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
      width: 90%;
      max-width: 600px;
    }

    .hero-text {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      text-align: center;
      align-items: center;
    }

    .hero-text h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3rem, 6.5vw, 5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .hero-text h1 span {
      color: var(--color-primary);
    }

    .hero-text p {
      font-size: clamp(1.1rem, 2.2vw, 1.4rem);
      color: var(--color-text-secondary);
      line-height: 1.35;
      max-width: 520px;
    }

    /* Caixa do Scanner */
    .scanner-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scanner-box {
      width: clamp(280px, 45vh, 400px);
      height: clamp(280px, 45vh, 400px);
      background: rgba(24, 24, 27, 0.4);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow-glow), 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Moldura estilo mira do Scanner */
    .scanner-frame {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      bottom: 24px;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scanner-frame::before,
    .scanner-frame::after,
    .scanner-frame span::before,
    .scanner-frame span::after {
      content: '';
      position: absolute;
      width: 40px;
      height: 40px;
      border-color: var(--color-primary);
      border-style: solid;
    }

    .scanner-frame::before {
      top: -2px; left: -2px;
      border-width: 4px 0 0 4px;
      border-top-left-radius: 12px;
    }
    .scanner-frame::after {
      top: -2px; right: -2px;
      border-width: 4px 4px 0 0;
      border-top-right-radius: 12px;
    }
    .scanner-frame span::before {
      bottom: -2px; left: -2px;
      border-width: 0 0 4px 4px;
      border-bottom-left-radius: 12px;
    }
    .scanner-frame span::after {
      bottom: -2px; right: -2px;
      border-width: 0 4px 4px 0;
      border-bottom-right-radius: 12px;
    }

    /* Linha de Scanner Animada */
    .scan-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: var(--color-primary);
      box-shadow: 0 0 12px 2px var(--color-primary);
      top: 0;
      left: 0;
      animation: scan 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    @keyframes scan {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(clamp(232px, calc(45vh - 48px), 352px)); opacity: 0; }
    }

    .scanner-icon {
      font-size: 4rem;
      color: rgba(255,255,255,0.1);
      margin-bottom: 1rem;
    }

    .scanner-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.125rem;
      font-weight: 500;
      color: var(--color-text-secondary);
      text-align: center;
    }

    /* Modal de Feedback/Status da Impressora */
    .toast-container {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--color-surface-elevated);
      color: var(--color-text-primary);
      padding: 12px 24px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
    }

    .toast-container.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-icon {
      font-size: 1.5rem;
    }

    .toast-icon.success { color: var(--color-primary); }
    .toast-icon.error { color: var(--color-danger); }

  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Cabeçalho -->
    <header class="header">
      <div class="logo-container">
        <!-- Logo do Cheguei -->
        <img src="logo_cheguei_corporate_transparent.png" alt="Cheguei Logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgNjAiPjx0ZXh0IHk9IjM1IiBmb250LWZhbWlseT0iU3BhY2UgR3JvdGVzaywgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZm9udC13ZWlnaHQ9ImJvbGQiIGZpbGw9IiMwMGE4NTkiPkNIRUdVRUk8L3RleHQ+PC9zdmc+'" />
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content">
      
      <div class="hero-text">
        <h1>Check-in<br><span>Rápido e Fácil</span></h1>
        <p>Aponte a câmera do seu celular para o QR Code abaixo para iniciar seu check-in pelo WhatsApp.</p>
      </div>

      <div class="whatsapp-qr-container" style="display: flex; justify-content: center; align-items: center; margin-top: 0.5rem;">
        <div style="background: white; padding: 16px; border-radius: var(--radius-lg); box-shadow: var(--shadow-glow);">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https%3A%2F%2Fwa.me%2F553399852549%3Ftext%3DQuero%20fazer%20o%20meu%20check-in" alt="QR Code WhatsApp" style="width: 260px; height: 260px; max-width: 65vw; max-height: 30vh; display: block;" />
        </div>
      </div>

    </main>

  </div>

  <!-- Botão Flutuante da Impressora USB (FORA do container para evitar z-index issues) -->
  <button class="printer-module" id="btn-connect-printer" title="Conectar Impressora USB">
    <i class="ph ph-usb" id="printer-icon"></i>
    <div class="status-dot" id="status-dot"></div>
  </button>

  <!-- Botão Flutuante do Editor de Etiquetas -->
  <a href="editor.html" class="editor-module" title="Abrir Editor de Etiquetas ZPL">
    <i class="ph ph-sliders"></i> Editor de Etiquetas
  </a>

  <!-- Notificações Toast -->
  <div class="toast-container" id="toast">
    <i class="ph ph-check-circle toast-icon" id="toast-icon"></i>
    <span id="toast-message">Mensagem</span>
  </div>

  <script>
    // Referências DOM
    const btnConnect = document.getElementById('btn-connect-printer');
    const statusDot = document.getElementById('status-dot');
    const printerIcon = document.getElementById('printer-icon');
    const toast = document.getElementById('toast');
    const toastIcon = document.getElementById('toast-icon');
    const toastMessage = document.getElementById('toast-message');

    let usbDevice = null;
    let outEndpoint = null;
    let claimedInterface = null;

    // Função para mostrar notificação
    function showToast(message, type = 'success') {
      toastMessage.textContent = message;
      
      if (type === 'success') {
        toastIcon.className = 'ph ph-check-circle toast-icon success';
      } else {
        toastIcon.className = 'ph ph-warning-circle toast-icon error';
      }

      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 5000);
    }

    // Atualiza a UI baseada no status de conexão
    function updatePrinterStatus(connected) {
      if (connected) {
        btnConnect.classList.add('connected');
        statusDot.classList.add('connected');
        printerIcon.className = 'ph ph-printer';
        btnConnect.title = 'Imprimir Teste';
      } else {
        btnConnect.classList.remove('connected');
        statusDot.classList.remove('connected');
        printerIcon.className = 'ph ph-usb';
        btnConnect.title = 'Conectar Impressora USB';
      }
    }

    // Função principal: Conectar ou Imprimir
    async function handlePrinterConnection() {
      if (!navigator.usb) {
        showToast('WebUSB não suportado. Use Chrome/Edge via HTTPS ou Localhost.', 'error');
        return;
      }

      // Se já conectado, imprime teste
      if (usbDevice && outEndpoint !== null) {
        printTestLabel();
        return;
      }

      try {
        showToast('Abrindo seletor de dispositivos USB...', 'success');

        // Solicitar dispositivo USB (sem filtro para listar todos)
        const device = await navigator.usb.requestDevice({ filters: [] });
        
        console.log('Dispositivo selecionado:', device.productName, 
                     'VID:', '0x' + device.vendorId.toString(16), 
                     'PID:', '0x' + device.productId.toString(16));
        
        showToast('Conectando a ' + (device.productName || 'Impressora') + '...', 'success');

        await device.open();
        console.log('Dispositivo aberto com sucesso.');

        // Selecionar configuração (se não houver uma ativa)
        if (device.configuration === null) {
          await device.selectConfiguration(1);
          console.log('Configuração 1 selecionada.');
        }

        // Varrer TODAS as interfaces para encontrar um endpoint OUT (Bulk Transfer)
        let foundEndpoint = null;
        let foundInterfaceNum = null;

        const config = device.configuration;
        console.log('Configuração:', config.configurationValue, 
                     '- Interfaces:', config.interfaces.length);

        for (const iface of config.interfaces) {
          console.log('Interface', iface.interfaceNumber, 
                       '- Alternates:', iface.alternates.length);
          
          for (const alt of iface.alternates) {
            console.log('  Alternate', alt.alternateSetting, 
                         '- Class:', alt.interfaceClass,
                         '- Subclass:', alt.interfaceSubclass,
                         '- Endpoints:', alt.endpoints.length);
            
            for (const ep of alt.endpoints) {
              console.log('    Endpoint', ep.endpointNumber, 
                           '- Direction:', ep.direction, 
                           '- Type:', ep.type);
              
              // Procura o primeiro endpoint Bulk OUT
              if (ep.direction === 'out' && ep.type === 'bulk') {
                foundEndpoint = ep.endpointNumber;
                foundInterfaceNum = iface.interfaceNumber;
                console.log('>>> ENCONTRADO Endpoint OUT:', foundEndpoint, 
                             'na Interface:', foundInterfaceNum);
              }
            }
          }
        }

        if (foundEndpoint === null) {
          // Fallback: tentar qualquer endpoint OUT (não apenas bulk)
          for (const iface of config.interfaces) {
            for (const alt of iface.alternates) {
              for (const ep of alt.endpoints) {
                if (ep.direction === 'out') {
                  foundEndpoint = ep.endpointNumber;
                  foundInterfaceNum = iface.interfaceNumber;
                  console.log('>>> FALLBACK Endpoint OUT:', foundEndpoint, 
                               'na Interface:', foundInterfaceNum);
                }
              }
            }
          }
        }

        if (foundEndpoint === null || foundInterfaceNum === null) {
          throw new Error('Nenhum endpoint de saída encontrado. Verifique se a impressora está ligada e conectada via USB.');
        }

        // Reivindicar a interface encontrada
        await device.claimInterface(foundInterfaceNum);
        console.log('Interface', foundInterfaceNum, 'reivindicada com sucesso.');

        usbDevice = device;
        outEndpoint = foundEndpoint;
        claimedInterface = foundInterfaceNum;

        updatePrinterStatus(true);
        showToast('✅ ' + (device.productName || 'Elgin L42') + ' conectada! Toque para imprimir teste.', 'success');

      } catch (error) {
        console.error('Erro na conexão USB:', error);
        
        if (error.name === 'NotFoundError') {
          showToast('Seleção cancelada. Toque novamente para tentar.', 'error');
        } else if (error.name === 'SecurityError') {
          showToast('Acesso negado. Acesse via HTTPS ou Localhost.', 'error');
        } else if (error.name === 'NetworkError') {
          showToast('Erro de rede USB. Desconecte e reconecte a impressora.', 'error');
        } else if (error.message && error.message.includes('claimed')) {
          showToast('Interface USB ocupada. Feche outros apps usando a impressora.', 'error');
        } else {
          showToast('Erro: ' + error.message, 'error');
        }
      }
    }

    // Configuração do Supabase (Usando a Publishable Key para o Frontend)
    const SUPABASE_URL = 'https://eqadpgfpicxfpyaitnrn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_YV0sk8AJJhm9CTB7p4AkCw_y8JoeNxw';
    let supabaseClient = null;

    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      console.log('Supabase conectado com sucesso.');
    }

    let isProcessingQueue = false;

    // Remove acentos e caracteres especiais para evitar símbolos quebrados/quadrados na Elgin ZPL (Font 0)
    function cleanZPLText(str) {
      if (!str) return '';
      return str
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[çÇ]/g, 'C')
        .replace(/[ãÃ]/g, 'A')
        .replace(/[õÕ]/g, 'O')
        .replace(/[áàâäÁÀÂÄ]/g, 'A')
        .replace(/[éèêëÉÈÊË]/g, 'E')
        .replace(/[íìîïÍÌÎÏ]/g, 'I')
        .replace(/[óòôöÓÒÔÖ]/g, 'O')
        .replace(/[úùûüÚÙÛÜ]/g, 'U')
        .replace(/[^\w\s\-\.\,\&\/]/gi, '')
        .trim();
    }

    // Extrai apenas o PRIMEIRO e ÚLTIMO NOME sem acentos (ex: "HERMANI GOMES GONÇALVES" -> "HERMANI GONCALVES")
    function getFirstAndLastName(fullName) {
      if (!fullName) return 'PARTICIPANTE';
      const clean = cleanZPLText(fullName);
      const parts = clean.split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].toUpperCase();
      return `${parts[0]} ${parts[parts.length - 1]}`.toUpperCase();
    }

    // Impressão de etiqueta ZPL individual com dados do participante (Modelo Crachá Idêntico à Foto 1)
    async function printParticipantLabel(inscricao) {
      if (!usbDevice || outEndpoint === null) return false;
      
      const nomeFormatado = getFirstAndLastName(inscricao.nome);
      
      const cargoClean = cleanZPLText(inscricao.cargo).toUpperCase();
      const empresaClean = cleanZPLText(inscricao.orgao_empresa || inscricao.empresa).toUpperCase();
      
      let cargoEmpresa = '';
      if (cargoClean && empresaClean) {
        cargoEmpresa = `${cargoClean} - ${empresaClean}`;
      } else {
        cargoEmpresa = cargoClean || empresaClean;
      }

      const cidade = cleanZPLText(inscricao.cidade).toUpperCase();

      const encoder = new TextEncoder();
      // Comando ZPL com largura física de 640 dots (80mm), redefinição de origem ^LH0,0 e Cargo-Empresa tamanho 25 centralizado
      const zplCommand = `^XA
^PW640
^LL240
^LH0,0
^CF0,52
^FO0,35^FB640,1,0,C,0^FD${nomeFormatado}^FS
^CF0,25
^FO0,105^FB640,1,0,C,0^FD${cargoEmpresa}^FS
^CF0,25
^FO0,152^FB640,1,0,C,0^FD${cidade}^FS
^XZ`;

      const data = encoder.encode(zplCommand);
      console.log('Enviando etiqueta ZPL limpa para:', nomeFormatado);
      await usbDevice.transferOut(outEndpoint, data);
      return true;
    }

    // Loop de Verificação Automática (Polling de 3s)
    async function checkPendingPrints() {
      if (isProcessingQueue) return;
      if (!usbDevice || outEndpoint === null) return; // Só executa se impressora estiver conectada
      if (!supabaseClient) return;

      isProcessingQueue = true;

      try {
        // Buscar inscrições confirmadas (confirmado = true) e não impressas (impresso = false)
        const { data: pendentes, error } = await supabaseClient
          .from('inscricoes')
          .select('*')
          .eq('confirmado', true)
          .eq('impresso', false)
          .order('id', { ascending: true });

        if (error) {
          console.error('Erro ao consultar inscrições pendentes no Supabase:', error);
          isProcessingQueue = false;
          return;
        }

        if (pendentes && pendentes.length > 0) {
          console.log(`Fila de Impressão: ${pendentes.length} etiqueta(s) pendente(s)`);
          
          for (const item of pendentes) {
            showToast(`🖨️ Imprimindo: ${getFirstAndLastName(item.nome)}`, 'success');
            
            try {
              const impressoOK = await printParticipantLabel(item);
              
              if (impressoOK) {
                // Atualiza o banco no Supabase: impresso = true
                const { error: updateErr } = await supabaseClient
                  .from('inscricoes')
                  .update({ 
                    impresso: true, 
                    data_impressao: new Date().toISOString() 
                  })
                  .eq('id', item.id);

                if (updateErr) {
                  console.error(`Erro ao atualizar impresso=true para ID ${item.id}:`, updateErr);
                } else {
                  console.log(`✅ Inscrição #${item.id} (${item.nome}) impressa e atualizada no Supabase!`);
                  showToast(`✅ Etiqueta impressa: ${getFirstAndLastName(item.nome)}`, 'success');
                }
              }
            } catch (printErr) {
              console.error(`Falha ao imprimir etiqueta de ${item.nome}:`, printErr);
              showToast(`Erro na impressão de ${item.nome}`, 'error');
              break; // Pausa a fila se a impressora der erro
            }

            // Pausa de 1.5s entre etiquetas
            await new Promise(r => setTimeout(r, 1500));
          }
        }
      } catch (err) {
        console.error('Exceção no loop de impressão automática:', err);
      } finally {
        isProcessingQueue = false;
      }
    }

    // Inicia verificação automática a cada 3 segundos
    setInterval(checkPendingPrints, 3000);

    // Impressão de teste manual usando o layout idêntico à Foto 1 com Cargo-Empresa tamanho 30
    async function printTestLabel() {
      if (!usbDevice || outEndpoint === null) return;
      
      showToast('Enviando etiqueta de teste...', 'success');

      try {
        const encoder = new TextEncoder();
        const zplCommand = `^XA
^PW640
^LL240
^LH0,0
^CF0,52
^FO0,35^FB640,1,0,C,0^FDHERMANI FONSECA^FS
^CF0,25
^FO0,105^FB640,1,0,C,0^FDDESENVOLVEDOR DE SISTEMAS - POLIS GESTAO^FS
^CF0,25
^FO0,152^FB640,1,0,C,0^FDGOVERNADOR VALADARES^FS
^XZ`;

        const data = encoder.encode(zplCommand);
        await usbDevice.transferOut(outEndpoint, data);
        showToast('✅ Etiqueta de teste impressa com sucesso!', 'success');

      } catch (error) {
        console.error('Erro ao imprimir:', error);
        showToast('Erro ao imprimir: ' + error.message, 'error');
        
        if (error.name === 'NotFoundError' || error.name === 'NetworkError') {
          usbDevice = null;
          outEndpoint = null;
          claimedInterface = null;
          updatePrinterStatus(false);
          showToast('Impressora desconectada. Reconecte e tente novamente.', 'error');
        }
      }
    }

    // Eventos de Listener (click + touchend para tablets)
    if (btnConnect) {
      btnConnect.addEventListener('click', handlePrinterConnection);
      btnConnect.addEventListener('touchend', function(e) {
        e.preventDefault();
        handlePrinterConnection();
      });
    }

    // Escuta eventos globais de conexão/desconexão USB do navegador
    if (navigator.usb) {
      navigator.usb.addEventListener('disconnect', event => {
        if (usbDevice && event.device === usbDevice) {
          usbDevice = null;
          outEndpoint = null;
          claimedInterface = null;
          updatePrinterStatus(false);
          showToast('Impressora desconectada.', 'error');
        }
      });
    }

  </script>
